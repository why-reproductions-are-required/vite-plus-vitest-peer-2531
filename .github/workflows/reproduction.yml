name: Reproduction matrix

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - name: Install the reported npm version
        run: npm install --global npm@12.0.2
      - name: Verify tool versions
        run: |
          test "$(node --version)" = "v26.5.0"
          test "$(npm --version)" = "12.0.2"
      - name: Verify the reported case installs
        working-directory: reported
        run: npm install --package-lock=false
      - name: Verify the provider mismatch fails with ERESOLVE
        working-directory: conflict
        run: |
          set +e
          output="$(npm install --package-lock=false 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q ERESOLVE
      - name: Verify the aligned provider installs
        working-directory: aligned
        run: npm install --package-lock=false
      - name: Verify the upstream fix installs
        working-directory: upstream-fix
        run: npm install --package-lock=false
